[project]
name = "finscope"
version = "0.1.0"
description = "Multi-agent AI system for investment research and financial market analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"

dependencies = [
    # Agents
    "langchain>=1,<2",
    # LLM providers
    "langchain-groq>=1,<2",
    # Web research
    "httpx>=0.28,<1",
    # Configuration and validation
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    # Observability
    "structlog>=25",
    "langchain-ollama>=1.2.0",
    "langchain-openai>=1.8.5",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
